[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; ============ WINDOWS BRIDGE (in-container relays; see bridge/Bridge.bat) ============
[program:windows-bridge]
command=socat TCP4-LISTEN:27042,fork,reuseaddr TCP4:host.docker.internal:27042
priority=3
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:windows-frida]
command=socat TCP4-LISTEN:27043,fork,reuseaddr TCP4:host.docker.internal:27043
priority=3
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:windows-agent]
command=socat TCP4-LISTEN:27044,fork,reuseaddr TCP4:host.docker.internal:27044
priority=3
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ============ RE MCP upstreams ============
[program:rea]
command=node /app/mcp_http_bridge.js 4012 node /opt/rea/lib/node_modules/rea-agents/scripts/rea.mjs mcp
environment=NODE_PATH="/opt/rea/lib/node_modules",HOME="/root"
priority=5
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pycode]
command=node /app/mcp_http_bridge.js 4013 /opt/pycode-venv/bin/python /app/pycode-mcp/mcp_server.py
directory=/work
priority=5
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:open-reverselab]
command=node /app/mcp_http_bridge.js 4018 /opt/reverselab-venv/bin/python tools/skills/mcp/ReverseLabToolsMCP/reverse_lab_tools_mcp.py
directory=/opt/open-reverselab
environment=REVERSELAB_HOST_PYTHON="/usr/bin/python3",JAVA_HOME="/opt/jdk",PATH="/opt/jdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME="/root"
priority=5
autorestart=true
startsecs=8
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x64dbg]
command=node /app/mcp_http_bridge.js 4016 npx -y x64dbg-mcp-server
environment=X64DBG_MCP_HOST="127.0.0.1",X64DBG_MCP_PORT="27042",HOME="/root"
priority=8
autorestart=true
startsecs=8
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:frida]
command=node /app/mcp_http_bridge.js 4017 npx -y frida-mcp@latest
environment=HOME="/root"
priority=8
autorestart=true
startsecs=8
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:hexstrike-server]
command=python3 /opt/hexstrike-ai/hexstrike_server.py --port 8888
priority=5
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:hexstrike-mcp]
command=node /app/mcp_http_bridge.js 4050 python3 /opt/hexstrike-ai/hexstrike_mcp.py --server http://127.0.0.1:8888
environment=HOME="/root"
priority=8
autorestart=true
startsecs=8
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ============ aggregator ============
[program:re-stack]
command=python3 /opt/wait_re_stack.py
environment=WEBSTACK_CONFIG="/data/config/config.json",WEBSTACK_TIMEOUT_MS="900000",HOME="/root"
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
